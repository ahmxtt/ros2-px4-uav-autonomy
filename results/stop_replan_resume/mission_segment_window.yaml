content: Window of the nominal mission reference segment 'start_to_poi1' around the
  Stop-Replan-Resume event.
why_a_window: The full multi-POI mission reference (16157 samples) is a large derived
  product that this release does not ship. The local replanner reads the segment only
  for the ROI bounding box and for the lead-in / tail-in anchors, so this window is
  the complete input for reproducing the replan geometry.
