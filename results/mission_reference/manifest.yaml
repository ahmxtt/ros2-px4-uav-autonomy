artifact: mission_reference
purpose: >-
  Complete multi-POI nominal mission reference for the forest_map2 scenario.
  This is the world-frame geometric and kinematic reference that the PX4
  Offboard executor and the Stop-Replan-Resume (SRR) node follow: it defines
  where the vehicle should be, which way it should point, and how fast it
  should travel, for the entire mission from the takeoff point back to the
  takeoff point.
status: >-
  Curated public copy of the canonical mission reference produced by the
  research pipeline. Byte-identical to the canonical artifact; the manifest
  below was rewritten for publication and carries no host, user or absolute
  path information.
data_class: >-
  Derived mission product, not raw data. Every column is computed - A* over an
  occupancy grid, B-spline refinement, analytic orbit geometry and a
  curvature-bounded speed profile. Nothing here was measured from a sensor.

source_scenario:
  world: sim/worlds/forest_map2.sdf
  scenario: sim/scenarios/forest_map2.yaml
  planning_config: sim/config/robot_map2_safe.yaml
  planning_map: >-
    Execution prior occupancy grid of the forest_map2 world at the 2.0 m
    reference altitude, 0.05 m per cell. Rebuild the equivalent map with
    tools/build_prior_map.py.

coordinate_frame:
  name: Gazebo world ENU, planar
  x_m: East, metres
  y_m: North, metres
  yaw_rad: >-
    Heading in the world ENU frame, measured counter-clockwise from +x (East),
    wrapped to (-pi, pi].
  altitude: >-
    Not a column. The mission is planned in 2D at a constant reference
    altitude of 2.0 m above the takeoff point; the altitude enters when
    tools/build_ned_setpoints.py emits z_ned_m = -2.0.
  origin_note: >-
    The vehicle spawn / takeoff point is world (-50.0, -70.0). The PX4 local
    NED origin is anchored there by the documented transform
    (x_ned = y_world + 70.0, y_ned = x_world + 50.0).

columns:
  segment_id: Integer 1..5, mission-ordered.
  segment_type: leg or orbit.
  segment_name: start_to_poi1, orbit_poi1, poi1_to_poi2, orbit_poi2, poi2_to_start.
  s_m: Cumulative arc length from the mission start, metres. Monotonically increasing across all segments.
  x_m: World ENU East, metres.
  y_m: World ENU North, metres.
  yaw_rad: World ENU heading, radians.
  curvature_1_per_m: Signed path curvature, 1/m.
  v_ref_mps: Reference speed from the curvature-bounded profile, m/s.
  t_ref_s: Cumulative reference time from the mission start, seconds.

