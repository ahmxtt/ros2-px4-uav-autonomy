  smoother: clearance_preserving
  points_of_interest:
    poi1_xy_m: [15.0, 5.0]
    poi2_xy_m: [-30.0, 24.0]
  start_xy_m: [-50.0, -70.0]

creation_method: >-
  Three travel legs planned with a deterministic 8-connected grid A* over the
  execution prior at r_eff = 0.65 m, refined with a clearance-preserving cubic
  B-spline, and interleaved with two analytic circular orbits. A
  curvature-bounded forward/backward speed profile was then applied across the
  whole mission and the segments were stitched with the transition continuity
  checks recorded in transition_metrics.yaml. Produced offline; no simulator or
  vehicle was involved.

reproducibility: >-
  This file is published as data, not regenerated by this repository. The
  public offline chain (tools/reproduce_offline_demo.py) reproduces a
  single-leg planning result exactly; it does not rebuild the multi-POI
  mission, because the multi-leg policy planner, the orbit generator and the
  mission stitcher were not part of the public extraction. Treat
  mission_reference.csv as a fixed input.

consumers:
  - tools/build_ned_setpoints.py
  - ros2/nodes/offboard_mission_executor.py
  - ros2/nodes/stop_replan_resume_node.py
  - tools/reproduce_srr_geometry.py (via results/stop_replan_resume/mission_segment_window.csv)

relation_to_other_public_files:
  results/stop_replan_resume/mission_segment_window.csv: >-
    An exact row-for-row slice of this file: segment 1, samples 765..3655
    (0-based 764..3654), arc length 15.019014 m to 71.995748 m. Verified by
    tests/test_mission_reference.py.
  results/planning/path.csv: >-
    A DIFFERENT artifact. It is a standalone single-leg planning result used
    for the offline reproduction demo and is not the A* path behind segment 1
    of this mission - the mission legs were planned with the multi-leg policy
    planner, which is not part of this release. Do not compare the two.

