[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "uav-autonomy"
version = "0.1.0"
description = "Offline planning, trajectory refinement and local replanning for a ROS 2 / PX4 UAV"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["uav", "ros2", "px4", "path-planning", "a-star", "b-spline", "gazebo"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pyyaml>=6.0",
  "pillow>=9.0",
  "matplotlib>=3.5",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.urls]
Source = "https://github.com/ahmxtt/ros2-px4-uav-autonomy"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
